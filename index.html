<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>SENDA — Conecte-se. Converse. Siga em frente.</title>
    <meta name="description" content="SENDA — Aplicativo de comunicação moderna, minimalista, privada e rápida." />
    <meta property="og:title" content="SENDA — Conecte-se. Converse. Siga em frente." />
    <meta property="og:description" content="SENDA — Aplicativo de comunicação moderna, minimalista, privada e rápida." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#121316" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('theme');
          var personalization = localStorage.getItem('senda_personalization');
          var mode = saved;
          if (!mode && personalization) {
            var parsed = JSON.parse(personalization);
            mode = parsed.themeMode;
          }
          var isDark = mode === 'dark' || (!mode && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="antialiased selection:bg-neutral-800 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
